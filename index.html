<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTC Вінрейт Трекер</title>
<style id="mainStyles">
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #0f131a;
    color: #e0e3eb;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 8px;
    user-select: none;
  }
  .card {
    width: 100%;
    max-width: 265px;
    background: #181c27;
    border-radius: 16px;
    padding: 14px;
    border: 1px solid #2a2f3d;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    text-align: center;
  }
  .btn-pip {
    width: 100%;
    background: #2962ff;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    transition: background 0.15s;
  }
  .btn-pip:hover {
    background: #1e53e5;
  }
  .pair-select {
    width: 100%;
    background: #10141d;
    color: #ffffff;
    border: 1px solid #323949;
    border-radius: 10px;
    padding: 7px 8px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 10px;
    cursor: pointer;
    outline: none;
  }
  .winrate-box {
    background: #10141d;
    border: 1px solid #252a37;
    border-radius: 12px;
    padding: 10px 8px;
    margin-bottom: 10px;
  }
  .winrate-label {
    font-size: 10px;
    color: #848e9c;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 2px;
  }
  .winrate-value {
    font-size: 32px;
    font-weight: 800;
    color: #e0e3eb;
    line-height: 1.1;
  }
  .counters {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    background: #10141d;
    border: 1px solid #252a37;
    border-radius: 10px;
    padding: 6px 4px;
    margin-bottom: 10px;
    font-size: 10px;
    color: #848e9c;
  }
  .counters div b {
    display: block;
    font-size: 15px;
    margin-top: 2px;
  }
  .plus-text { color: #00e676; }
  .minus-text { color: #ff1744; }
  .total-text { color: #ffffff; }
  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 12px 0;
    font-size: 28px;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  .btn:hover {
    filter: brightness(1.1);
  }
  .btn:active {
    transform: scale(0.94);
  }
  .btn-plus {
    background-color: #00c853;
    color: #ffffff;
    border: 2px solid #00e676;
    box-shadow: 0 4px 12px rgba(0, 200, 83, 0.35);
  }
  .btn-minus {
    background-color: #d50000;
    color: #ffffff;
    border: 2px solid #ff1744;
    box-shadow: 0 4px 12px rgba(213, 0, 0, 0.35);
  }
  .dots {
    font-size: 11px;
    letter-spacing: 2px;
    min-height: 16px;
    margin-bottom: 10px;
    word-break: break-all;
  }
  .footer {
    display: flex;
    gap: 8px;
  }
  .btn-small {
    flex: 1;
    background: #232836;
    color: #9aa3b2;
    border: 1px solid #2f3646;
    border-radius: 8px;
    padding: 5px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-small:hover {
    color: #ffffff;
    background: #2b3142;
  }
</style>
</head>
<body>

<div class="card" id="trackerCard">
  <button class="btn-pip" id="pipBtn">📌 Закріпити поверх екрана</button>

  <select id="pairSelect" class="pair-select">
    <option value="EURUSD_otc">💎 EURUSD_otc</option>
    <option value="GBPUSD_otc">💎 GBPUSD_otc</option>
    <option value="USDJPY_otc">💎 USDJPY_otc</option>
    <option value="AUDUSD_otc">💎 AUDUSD_otc</option>
    <option value="USDCAD_otc">💎 USDCAD_otc</option>
    <option value="USDCHF_otc">💎 USDCHF_otc</option>
    <option value="EURJPY_otc">💎 EURJPY_otc</option>
    <option value="GBPJPY_otc">💎 GBPJPY_otc</option>
    <option value="AUDCAD_otc">💎 AUDCAD_otc</option>
    <option value="EURGBP_otc">💎 EURGBP_otc</option>
  </select>

  <div class="winrate-box">
    <div class="winrate-label">Прибуткових угод</div>
    <div class="winrate-value" id="winRate">0.0%</div>
  </div>

  <div class="counters">
    <div>Плюс (+)<b class="plus-text" id="plusCount">0</b></div>
    <div>Мінус (−)<b class="minus-text" id="minusCount">0</b></div>
    <div>Усього<b class="total-text" id="totalCount">0</b></div>
  </div>

  <div class="buttons">
    <button class="btn btn-plus" id="btnPlus">+</button>
    <button class="btn btn-minus" id="btnMinus">−</button>
  </div>

  <div class="dots" id="dots"></div>

  <div class="footer">
    <button class="btn-small" id="btnUndo">↩ Назад</button>
    <button class="btn-small" id="btnReset">🗑 Скинути</button>
  </div>
</div>

<script>
  let state = JSON.parse(localStorage.getItem('otc_simple_tracker')) || {
    pair: 'EURUSD_otc',
    results: []
  };

  let activeDoc = document;

  function getEl(id) {
    return activeDoc.getElementById(id) || document.getElementById(id);
  }

  function save() {
    localStorage.setItem('otc_simple_tracker', JSON.stringify(state));
    render();
  }

  // Надійна прив'язка кнопок через addEventListener (працює в обох вікнах!)
  document.getElementById('pairSelect').addEventListener('change', (e) => {
    state.pair = e.target.value;
    save();
  });

  document.getElementById('btnPlus').addEventListener('click', () => {
    state.results.push(true);
    save();
  });

  document.getElementById('btnMinus').addEventListener('click', () => {
    state.results.push(false);
    save();
  });

  document.getElementById('btnUndo').addEventListener('click', () => {
    if (state.results.length > 0) {
      state.results.pop();
      save();
    }
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    state.results = [];
    save();
  });

  document.getElementById('pipBtn').addEventListener('click', openFloatingWidget);

  function render() {
    const total = state.results.length;
    const wins = state.results.filter(Boolean).length;
    const losses = total - wins;
    const pct = total > 0 ? ((wins / total) * 100) : 0;

    const wrEl = getEl('winRate');
    if (wrEl) {
      wrEl.textContent = `${pct.toFixed(1)}%`;
      if (total === 0) wrEl.style.color = '#e0e3eb';
      else if (pct >= 60) wrEl.style.color = '#00e676';
      else if (pct >= 50) wrEl.style.color = '#f0b90b';
      else wrEl.style.color = '#ff1744';
    }

    if (getEl('plusCount')) getEl('plusCount').textContent = wins;
    if (getEl('minusCount')) getEl('minusCount').textContent = losses;
    if (getEl('totalCount')) getEl('totalCount').textContent = total;
    if (getEl('pairSelect')) getEl('pairSelect').value = state.pair;

    if (getEl('dots')) {
      getEl('dots').textContent = state.results
        .slice(-15)
        .map(r => r ? '🟢' : '🔴')
        .join('');
    }
  }

  async function openFloatingWidget() {
    if ('documentPictureInPicture' in window) {
      try {
        const pipWindow = await window.documentPictureInPicture.requestWindow({
          width: 280,
          height: 365
        });

        const styleClone = document.getElementById('mainStyles').cloneNode(true);
        pipWindow.document.head.appendChild(styleClone);

        const card = document.getElementById('trackerCard');
        const pipBtn = document.getElementById('pipBtn');
        pipBtn.style.display = 'none';

        pipWindow.document.body.appendChild(card);
        activeDoc = pipWindow.document;

        pipWindow.addEventListener('pagehide', () => {
          pipBtn.style.display = 'block';
          document.body.appendChild(card);
          activeDoc = document;
          render();
        });
      } catch (err) {
        alert("Не вдалося відкрити плаваюче вікно. Просто перетягніть вкладку у нове вузьке вікно.");
      }
    } else {
      window.open(window.location.href, 'OTCTracker', 'width=290,height=410,resizable=yes');
    }
  }

  render();
</script>
</body>
</html>
