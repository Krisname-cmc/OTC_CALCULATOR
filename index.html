<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER AI OTC — Автономний Термінал</title>
<style id="appStyles">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #0b0e14;
    color: #e0e3eb;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 8px;
    user-select: none;
  }
  .app-card {
    width: 100%;
    max-width: 280px;
    background: #151924;
    border-radius: 16px;
    padding: 12px;
    border: 1px solid #262c3a;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  }
  .top-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .btn-pip {
    flex: 1;
    background: #2962ff;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-sound {
    background: #222736;
    color: #e0e3eb;
    border: 1px solid #323949;
    border-radius: 8px;
    padding: 6px 9px;
    font-size: 12px;
    cursor: pointer;
  }
  .api-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
  }
  .api-bar input {
    flex: 1;
    background: #0e1118;
    border: 1px solid #2b3142;
    color: #9aa3b2;
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 10px;
  }
  .pair-select {
    width: 100%;
    background: #0e1118;
    color: #ffffff;
    border: 1px solid #323949;
    border-radius: 10px;
    padding: 7px 8px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
    outline: none;
    cursor: pointer;
  }
  /* БЛОК ЖИВОГО РАДАРА СИГНАЛІВ */
  .radar-box {
    background: #0e1118;
    border: 2px solid #252b3b;
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
    margin-bottom: 10px;
    transition: all 0.2s ease;
  }
  .radar-box.call {
    border-color: #00e676;
    background: rgba(0, 200, 83, 0.14);
  }
  .radar-box.put {
    border-color: #ff1744;
    background: rgba(213, 0, 0, 0.14);
  }
  .signal-title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .signal-sub {
    font-size: 11px;
    color: #9aa3b2;
  }
  /* БЛОК КАЛЬКУЛЯТОРА ВІНРЕЙТУ */
  .divider {
    height: 1px;
    background: #252b3b;
    margin: 8px 0;
  }
  .stats-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0e1118;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 8px;
    border: 1px solid #222736;
  }
  .winrate-big {
    font-size: 24px;
    font-weight: 800;
  }
  .mini-counts {
    text-align: right;
    font-size: 11px;
    line-height: 1.4;
  }
  .plus-c { color: #00e676; font-weight: 700; }
  .minus-c { color: #ff1744; font-weight: 700; }
  .trade-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .t-btn {
    border: none;
    border-radius: 10px;
    padding: 10px 0;
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    cursor: pointer;
  }
  .t-btn:active { transform: scale(0.95); }
  .t-plus { background: #00c853; border: 2px solid #00e676; }
  .t-minus { background: #d50000; border: 2px solid #ff1744; }
  .footer {
    display: flex;
    gap: 6px;
  }
  .f-btn {
    flex: 1;
    background: #202534;
    color: #848e9c;
    border: 1px solid #2c3345;
    border-radius: 6px;
    padding: 4px;
    font-size: 10px;
    cursor: pointer;
  }
  .f-btn:hover { color: #fff; }
</style>
</head>
<body>

<div class="app-card" id="mainWidget">
  <div class="top-bar">
    <button class="btn-pip" id="pipBtn">📌 Поверх вікон</button>
    <button class="btn-sound" id="soundBtn" title="Звуковий сигнал">🔊</button>
  </div>

  <div class="api-bar" id="apiBar">
    <input type="text" id="apiUrlInput" placeholder="https://railway.app">
  </div>

  <select id="pairSelect" class="pair-select">
    <option value="EURUSD_otc">💎 EURUSD_otc</option>
    <option value="GBPUSD_otc">💎 GBPUSD_otc</option>
    <option value="USDJPY_otc">💎 USDJPY_otc</option>
    <option value="AUDUSD_otc">💎 AUDUSD_otc</option>
    <option value="USDCAD_otc">💎 USDCAD_otc</option>
    <option value="USDCHF_otc">💎 USDCHF_otc</option>
    <option value="EURJPY_otc">💎 EURJPY_otc</option>
    <option value="GBPJPY_otc">💎 GBPJPY_otc</option>
    <option value="AUDCAD_otc">💎 AUDCAD_otc</option>
    <option value="EURGBP_otc">💎 EURGBP_otc</option>
  </select>

  <div class="radar-box" id="radarBox">
    <div class="signal-title" id="signalTitle">⏳ ОЧІКУВАННЯ</div>
    <div class="signal-sub" id="signalSub">Вставте URL сервера Railway зверху</div>
  </div>

  <div class="divider"></div>

  <div class="stats-row">
    <div>
      <div style="font-size: 10px; color: #848e9c;">ВІНРЕЙТ</div>
      <div class="winrate-big" id="winRate">0.0%</div>
    </div>
    <div class="mini-counts">
      <div>Плюс (+): <span class="plus-c" id="plusCount">0</span></div>
      <div>Мінус (−): <span class="minus-c" id="minusCount">0</span></div>
      <div>Усього: <b id="totalCount">0</b></div>
    </div>
  </div>

  <div class="trade-btns">
    <button class="t-btn t-plus" id="btnPlus">+</button>
    <button class="t-btn t-minus" id="btnMinus">−</button>
  </div>

  <div class="footer">
    <button class="f-btn" id="btnUndo">↩ Назад</button>
    <button class="f-btn" id="btnReset">🗑 Скинути</button>
  </div>
</div>

<script>
  let state = JSON.parse(localStorage.getItem('autonomous_otc_app')) || {
    apiUrl: '',
    pair: 'EURUSD_otc',
    sound: true,
    results: []
  };

  let activeDoc = document;
  let lastSignalKey = '';

  function getEl(id) {
    return activeDoc.getElementById(id) || document.getElementById(id);
  }

  function playBeep(isCall) {
    if (!state.sound) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = isCall ? 880 : 520;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch (e) {}
  }

  function saveState() {
    localStorage.setItem('autonomous_otc_app', JSON.stringify(state));
    renderTracker();
  }

  document.getElementById('apiUrlInput').value = state.apiUrl;
  document.getElementById('apiUrlInput').addEventListener('change', (e) => {
    state.apiUrl = e.target.value.trim().replace(/\/$/, '');
    saveState();
  });

  document.getElementById('pairSelect').addEventListener('change', (e) => {
    state.pair = e.target.value;
    lastSignalKey = '';
    saveState();
    pollServer();
  });

  document.getElementById('soundBtn').addEventListener('click', () => {
    state.sound = !state.sound;
    getEl('soundBtn').textContent = state.sound ? '🔊' : '🔇';
    saveState();
  });

  document.getElementById('btnPlus').addEventListener('click', () => {
    state.results.push(true);
    saveState();
  });

  document.getElementById('btnMinus').addEventListener('click', () => {
    state.results.push(false);
    saveState();
  });

  document.getElementById('btnUndo').addEventListener('click', () => {
    state.results.pop();
    saveState();
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    state.results = [];
    saveState();
  });

  function renderTracker() {
    const total = state.results.length;
    const wins = state.results.filter(Boolean).length;
    const losses = total - wins;
    const pct = total > 0 ? ((wins / total) * 100) : 0;

    const wrEl = getEl('winRate');
    if (wrEl) {
      wrEl.textContent = `${pct.toFixed(1)}%`;
      wrEl.style.color = total === 0 ? '#e0e3eb' : (pct >= 60 ? '#00e676' : (pct >= 50 ? '#f0b90b' : '#ff1744'));
    }
    if (getEl('plusCount')) getEl('plusCount').textContent = wins;
    if (getEl('minusCount')) getEl('minusCount').textContent = losses;
    if (getEl('totalCount')) getEl('totalCount').textContent = total;
  }

  async function pollServer() {
    if (!state.apiUrl) return;
    try {
      const res = await fetch(`${state.apiUrl}/api/status?symbol=${encodeURIComponent(state.pair)}`);
      const data = await res.json();

      // Оновлюємо список пар ТІЛЬКИ якщо змінилися відсотки виплат (щоб не скидати вибір на планшеті!)
      const sel = getEl('pairSelect');
      if (data.pairs && data.pairs.length > 0 && sel) {
        const newHash = data.pairs.map(p => `${p.symbol}:${p.payout}`).join('|');
        if (newHash !== window.lastPairsHash) {
          window.lastPairsHash = newHash;
          const currentVal = state.pair;
          sel.innerHTML = data.pairs.map(p =>
            `<option value="${p.symbol}" ${p.symbol === currentVal ? 'selected' : ''}>${p.payout >= 82 ? '🔥' : '🟢'} ${p.symbol} (${p.payout}%)</option>`
          ).join('');
        }
      }


      const box = getEl('radarBox');
      const title = getEl('signalTitle');
      const sub = getEl('signalSub');
      const an = data.analysis || {};

      box.className = 'radar-box';

      if (!data.connected) {
        title.textContent = '🔌 ПІДКЛЮЧЕННЯ...';
        sub.textContent = 'З’єднання з сервером котирувань';
      } else if (an.status === 'WARMING') {
        title.textContent = `⏳ ПРОГРІВ ${an.collected}/${an.needed}`;
        sub.textContent = 'Збір хвилинних свічок M1';
      } else if (an.status === 'WAIT_CANDLE') {
        title.textContent = `⏳ ПАУЗА ${an.wait_sec}с`;
        sub.textContent = 'Закриття свічки — чекаємо нову';
      } else if (an.status === 'SIGNAL') {
        const isCall = an.direction === 'CALL';
        box.classList.add(isCall ? 'call' : 'put');
        title.textContent = isCall ? '⬆️ ВХІД: CALL (3с)' : '⬇️ ВХІД: PUT (3с)';
        sub.textContent = `Ціна: ${an.price} | Сила: ${an.score} | Сек: :${String(an.sec).padStart(2, '0')}`;

        const sigKey = `${state.pair}_${an.direction}_${Math.floor(Date.now() / 15000)}`;
        if (sigKey !== lastSignalKey) {
          lastSignalKey = sigKey;
          playBeep(isCall);
        }
      } else {
        title.textContent = '⏸ ФЛЕТ / НЕМАЄ ІМПУЛЬСУ';
        sub.textContent = `Ціна: ${an.price || '—'} | RSI: ${an.rsi || '—'} | Сек: :${String(an.sec || 0).padStart(2, '0')}`;
      }
    } catch (err) {
      if (getEl('signalTitle')) getEl('signalTitle').textContent = '⚠️ ПОМИЛКА ЗВ’ЯЗКУ';
    }
  }

  document.getElementById('pipBtn').addEventListener('click', async () => {
    if ('documentPictureInPicture' in window) {
      const pipWin = await window.documentPictureInPicture.requestWindow({ width: 295, height: 420 });
      pipWin.document.head.appendChild(document.getElementById('appStyles').cloneNode(true));
      const widget = document.getElementById('mainWidget');
      document.getElementById('pipBtn').style.display = 'none';
      if (state.apiUrl) document.getElementById('apiBar').style.display = 'none';
      pipWin.document.body.appendChild(widget);
      activeDoc = pipWin.document;

      pipWin.addEventListener('pagehide', () => {
        document.getElementById('pipBtn').style.display = 'block';
        document.getElementById('apiBar').style.display = 'flex';
        document.body.appendChild(widget);
        activeDoc = document;
        renderTracker();
      });
    } else {
      // Режим компактного вигляду для планшета (iPad Slide Over / Android Спливаюче вікно)
      const apiBar = document.getElementById('apiBar');
      const pipBtn = document.getElementById('pipBtn');
      if (state.apiUrl && apiBar.style.display !== 'none') {
        apiBar.style.display = 'none';
        pipBtn.textContent = '⚙️ Налаштування URL';
        alert('Для закріплення поверх Pocket Option на планшеті використайте системне спливаюче вікно:\n\n• iPad: три крапки (•••) зверху екрана → Slide Over\n• Android: меню недавніх програм → іконка браузера → Спливаюче вікно');
      } else {
        apiBar.style.display = 'flex';
        pipBtn.textContent = '📌 Компактний вигляд';
      }
    }
  });


  renderTracker();
  setInterval(pollServer, 250);
</script>
</body>
</html>
