<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTC Вінрейт Трекер</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #0f131a;
    color: #e0e3eb;
    display: flex;
    justify-content: center;
    padding: 12px;
    user-select: none;
  }
  .card {
    width: 100%;
    max-width: 280px;
    background: #181c27;
    border-radius: 16px;
    padding: 16px;
    border: 1px solid #2a2f3d;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    text-align: center;
  }
  .pair-select {
    width: 100%;
    background: #10141d;
    color: #ffffff;
    border: 1px solid #323949;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 14px;
    cursor: pointer;
    outline: none;
  }
  .winrate-box {
    background: #10141d;
    border: 1px solid #252a37;
    border-radius: 14px;
    padding: 14px 10px;
    margin-bottom: 14px;
  }
  .winrate-label {
    font-size: 11px;
    color: #848e9c;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 4px;
  }
  .winrate-value {
    font-size: 36px;
    font-weight: 800;
    color: #e0e3eb;
    line-height: 1.1;
  }
  .counters {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: #10141d;
    border: 1px solid #252a37;
    border-radius: 10px;
    padding: 8px 4px;
    margin-bottom: 14px;
    font-size: 11px;
    color: #848e9c;
  }
  .counters div b {
    display: block;
    font-size: 16px;
    margin-top: 2px;
  }
  .plus-text { color: #00e676; }
  .minus-text { color: #ff1744; }
  .total-text { color: #ffffff; }
  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 16px 0;
    font-size: 32px;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  .btn:hover {
    filter: brightness(1.1);
  }
  .btn:active {
    transform: scale(0.94);
  }
  /* ЗЕЛЕНА КНОПКА ПЛЮС */
  .btn-plus {
    background-color: #00c853;
    color: #ffffff;
    border: 2px solid #00e676;
    box-shadow: 0 4px 14px rgba(0, 200, 83, 0.35);
  }
  /* ЧЕРВОНА КНОПКА МІНУС */
  .btn-minus {
    background-color: #d50000;
    color: #ffffff;
    border: 2px solid #ff1744;
    box-shadow: 0 4px 14px rgba(213, 0, 0, 0.35);
  }
  .dots {
    font-size: 12px;
    letter-spacing: 2px;
    min-height: 18px;
    margin-bottom: 12px;
    word-break: break-all;
  }
  .footer {
    display: flex;
    gap: 8px;
  }
  .btn-small {
    flex: 1;
    background: #232836;
    color: #9aa3b2;
    border: 1px solid #2f3646;
    border-radius: 8px;
    padding: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-small:hover {
    color: #ffffff;
    background: #2b3142;
  }
</style>
</head>
<body>

<div class="card">
  <select id="pairSelect" class="pair-select" onchange="changePair()">
    <option value="EURUSD_otc">💎 EURUSD_otc</option>
    <option value="GBPUSD_otc">💎 GBPUSD_otc</option>
    <option value="USDJPY_otc">💎 USDJPY_otc</option>
    <option value="AUDUSD_otc">💎 AUDUSD_otc</option>
    <option value="USDCAD_otc">💎 USDCAD_otc</option>
    <option value="USDCHF_otc">💎 USDCHF_otc</option>
    <option value="EURJPY_otc">💎 EURJPY_otc</option>
    <option value="GBPJPY_otc">💎 GBPJPY_otc</option>
    <option value="AUDCAD_otc">💎 AUDCAD_otc</option>
    <option value="EURGBP_otc">💎 EURGBP_otc</option>
  </select>

  <div class="winrate-box">
    <div class="winrate-label">Прибуткових угод</div>
    <div class="winrate-value" id="winRate">0.0%</div>
  </div>

  <div class="counters">
    <div>Плюс (+)<b class="plus-text" id="plusCount">0</b></div>
    <div>Мінус (−)<b class="minus-text" id="minusCount">0</b></div>
    <div>Усього<b class="total-text" id="totalCount">0</b></div>
  </div>

  <div class="buttons">
    <button class="btn btn-plus" onclick="addResult(true)">+</button>
    <button class="btn btn-minus" onclick="addResult(false)">−</button>
  </div>

  <div class="dots" id="dots"></div>

  <div class="footer">
    <button class="btn-small" onclick="undoLast()">↩ Назад</button>
    <button class="btn-small" onclick="resetSession()">🗑 Скинути</button>
  </div>
</div>

<script>
  let state = JSON.parse(localStorage.getItem('otc_simple_tracker')) || {
    pair: 'EURUSD_otc',
    results: []
  };

  document.getElementById('pairSelect').value = state.pair;

  function save() {
    localStorage.setItem('otc_simple_tracker', JSON.stringify(state));
    render();
  }

  function changePair() {
    state.pair = document.getElementById('pairSelect').value;
    save();
  }

  function addResult(isWin) {
    state.results.push(isWin);
    save();
  }

  function undoLast() {
    if (state.results.length > 0) {
      state.results.pop();
      save();
    }
  }

  function resetSession() {
    if (!confirm("Очистити лічильник плюсів та мінусів?")) return;
    state.results = [];
    save();
  }

  function render() {
    const total = state.results.length;
    const wins = state.results.filter(Boolean).length;
    const losses = total - wins;
    const pct = total > 0 ? ((wins / total) * 100) : 0;

    const wrEl = document.getElementById('winRate');
    wrEl.textContent = `${pct.toFixed(1)}%`;

    if (total === 0) {
      wrEl.style.color = '#e0e3eb';
    } else if (pct >= 60) {
      wrEl.style.color = '#00e676';
    } else if (pct >= 50) {
      wrEl.style.color = '#f0b90b';
    } else {
      wrEl.style.color = '#ff1744';
    }

    document.getElementById('plusCount').textContent = wins;
    document.getElementById('minusCount').textContent = losses;
    document.getElementById('totalCount').textContent = total;

    document.getElementById('dots').textContent = state.results
      .slice(-15)
      .map(r => r ? '🟢' : '🔴')
      .join('');
  }

  render();
</script>
</body>
</html>
