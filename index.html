<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUPER AI PRO — 92% Radar M5</title>
  <style id="appStyles">
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body {
      background: #090d16;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 8px;
    }
    .widget {
      width: 100%;
      max-width: 360px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.65);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
      font-size: 13px;
      color: #e2e8f0;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      transition: 0.3s;
    }
    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .top-actions { display: flex; gap: 5px; }
    .icon-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .icon-btn:hover { background: #334155; }
    .radar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      padding: 0 2px;
    }
    .rows-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 310px;
      overflow-y: auto;
      margin-bottom: 10px;
      padding-right: 2px;
    }
    .rows-container::-webkit-scrollbar { width: 4px; }
    .rows-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    .pair-row {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.25s;
    }
    .pair-row.buy {
      background: rgba(16, 185, 129, 0.22);
      border-color: #10b981;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
    }
    .pair-row.sell {
      background: rgba(239, 68, 68, 0.22);
      border-color: #ef4444;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
    }
    .pair-left { display: flex; flex-direction: column; gap: 2px; }
    .pair-name { font-size: 13px; font-weight: 800; color: #f8fafc; display: flex; align-items: center; gap: 5px; }
    .payout-tag {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 5px;
    }
    .pair-meta { font-size: 10px; color: #94a3b8; }

    .pair-right { text-align: right; }
    .badge-action {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.3px;
    }
    .badge-buy { background: #10b981; color: #042f1e; }
    .badge-sell { background: #ef4444; color: #ffffff; }
    .badge-scan { background: #1e293b; color: #94a3b8; font-weight: 700; font-size: 11px; }
    .badge-warm { background: #1e293b; color: #60a5fa; font-weight: 700; font-size: 11px; }

    .stats-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 9px 10px;
    }
    .stats-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
    }
    .winrate { font-size: 18px; font-weight: 900; color: #38bdf8; }
    .counts { font-size: 11px; color: #94a3b8; display: flex; gap: 8px; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
    .btn-win {
      background: #10b981;
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 7px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-loss {
      background: #ef4444;
      color: #450a0a;
      border: none;
      border-radius: 8px;
      padding: 7px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
    }
    .sub-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .sub-btn {
      background: #1e293b;
      color: #94a3b8;
      border: none;
      border-radius: 6px;
      padding: 5px;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="widget" id="appWidget">
  <div class="header">
    <div class="brand">
      <span class="status-dot" id="connDot"></span>
      <span>RADAR 92% • M5</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnPip">📌 Поверх вікон</button>
      <button class="icon-btn" id="btnSound">🔊</button>
    </div>
  </div>

  <div class="radar-head">
    <span>Активні пари (виплата 92%+)</span>
    <span id="pairCount">0 пар</span>
  </div>

  <div class="rows-container" id="rowsContainer">
    <div class="pair-row">
      <div class="pair-left">
        <div class="pair-name">Підключення до ринку...</div>
        <div class="pair-meta">Пошук пар із виплатою 92%</div>
      </div>
      <div class="pair-right"><span class="badge-action badge-scan">WAIT</span></div>
    </div>
  </div>

  <div class="stats-box">
    <div class="stats-top">
      <div>
        <div style="font-size:10px;color:#64748b;">Winrate (M5)</div>
        <div class="winrate" id="winRateVal">0.0%</div>
      </div>
      <div class="counts">
        <span>+: <b id="countWin" style="color:#34d399;">0</b></span>
        <span>−: <b id="countLoss" style="color:#f87171;">0</b></span>
        <span>Всього: <b id="countTotal">0</b></span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-win" id="btnWin">+</button>
      <button class="btn-loss" id="btnLoss">−</button>
    </div>
    <div class="sub-btns">
      <button class="sub-btn" id="btnUndo">↩ Назад</button>
      <button class="sub-btn" id="btnReset">🗑 Скинути</button>
    </div>
  </div>
</div>
<script>
  const DEFAULT_API = 'https://super-ai-trader-pro-production.up.railway.app';
  const STORAGE_KEY = 'super_ai_radar_92_m5';
  let activeDoc = document;
  let alertedSignals = new Set();

  let state = {
    apiUrl: DEFAULT_API,
    sound: true,
    wins: 0,
    losses: 0,
    history: []
  };

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved && typeof saved === 'object') {
      state = { ...state, ...saved, apiUrl: DEFAULT_API };
    }
  } catch (e) {}

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function getEl(id) {
    return activeDoc.getElementById(id) || document.getElementById(id);
  }

  function playBeep(type) {
    if (!state.sound) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      if (ctx.state === 'suspended') ctx.resume();

      const notes = type === 'BUY' ? [660, 880, 1175] :;
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.18);

        gain.gain.setValueAtTime(0.01, ctx.currentTime + idx * 0.18);
        gain.gain.linearRampToValueAtTime(1.0, ctx.currentTime + idx * 0.18 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.18 + 0.45);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + idx * 0.18);
        osc.stop(ctx.currentTime + idx * 0.18 + 0.46);
      });
    } catch (e) {}
  }

  function renderStats() {
    const total = state.wins + state.losses;
    const rate = total > 0 ? ((state.wins / total) * 100).toFixed(1) : '0.0';
    const wEl = getEl('winRateVal');
    const cW = getEl('countWin');
    const cL = getEl('countLoss');
    const cT = getEl('countTotal');
    if (wEl) wEl.textContent = `${rate}%`;
    if (cW) cW.textContent = state.wins;
    if (cL) cL.textContent = state.losses;
    if (cT) cT.textContent = total;
  }

  function bindEvents(doc) {
    const btnWin = doc.getElementById('btnWin');
    if (btnWin) btnWin.onclick = () => { state.wins++; state.history.push('W'); saveState(); renderStats(); };

    const btnLoss = doc.getElementById('btnLoss');
    if (btnLoss) btnLoss.onclick = () => { state.losses++; state.history.push('L'); saveState(); renderStats(); };

    const btnUndo = doc.getElementById('btnUndo');
    if (btnUndo) btnUndo.onclick = () => {
      const last = state.history.pop();
      if (last === 'W' && state.wins > 0) state.wins--;
      if (last === 'L' && state.losses > 0) state.losses--;
      saveState();
      renderStats();
    };

    const btnReset = doc.getElementById('btnReset');
    if (btnReset) btnReset.onclick = () => {
      state.wins = 0; state.losses = 0; state.history = [];
      saveState();
      renderStats();
    };

    const btnSound = doc.getElementById('btnSound');
    if (btnSound) {
      btnSound.textContent = state.sound ? '🔊' : '🔇';
      btnSound.onclick = () => {
        state.sound = !state.sound;
        btnSound.textContent = state.sound ? '🔊' : '🔇';
        saveState();
      };
    }

    const btnPip = doc.getElementById('btnPip');
    if (btnPip && 'documentPictureInPicture' in window) {
      btnPip.onclick = async () => {
        try {
          const pipWin = await window.documentPictureInPicture.requestWindow({ width: 360, height: 540 });
          const style = document.getElementById('appStyles');
          if (style) pipWin.document.head.appendChild(style.cloneNode(true));
          const widget = document.getElementById('appWidget');
          if (widget) pipWin.document.body.appendChild(widget);
          activeDoc = pipWin.document;
          bindEvents(activeDoc);
          pipWin.addEventListener('pagehide', () => {
            document.body.appendChild(widget);
            activeDoc = document;
            bindEvents(activeDoc);
          });
        } catch (e) {}
      };
    }
  }

  async function pollServer() {
    try {
      const res = await fetch(`${state.apiUrl}/api/status`);
      const data = await res.json();

      const dot = getEl('connDot');
      if (dot) dot.className = data.connected ? 'status-dot online' : 'status-dot';

      const rows = Array.isArray(data.rows) ? data.rows : [];
      const countEl = getEl('pairCount');
      if (countEl) countEl.textContent = `${rows.length} пар (92%)`;

      const box = getEl('rowsContainer');
      if (!box) return;

      if (!data.connected) {
        box.innerHTML = `<div class="pair-row"><div class="pair-left"><div class="pair-name">З’єднання з сервером...</div><div class="pair-meta">Очікування підключення</div></div><div class="pair-right"><span class="badge-action badge-scan">OFFLINE</span></div></div>`;
        return;
      }

      if (rows.length === 0) {
        box.innerHTML = `<div class="pair-row"><div class="pair-left"><div class="pair-name">Немає пар із 92%</div><div class="pair-meta">Чекаємо підвищення відсотка</div></div><div class="pair-right"><span class="badge-action badge-scan">0 ПАР</span></div></div>`;
        return;
      }

      const minuteBucket = Math.floor(Date.now() / 60000);
      let hasNewSignal = null;

      box.innerHTML = rows.map(r => {
        let badgeHtml = `<span class="badge-action badge-scan">SCAN</span>`;
        let newBadge = '';
        let metaText = `CCI: ${r.cci ?? '—'} • RSI: ${r.rsi ?? '—'}`;

        const ls = r.last_signal;
        if (ls && ls.direction) {
          const isBuy = ls.direction === 'BUY';
          if (r.is_fresh) {
            newBadge = `<span class="new-tag">NEW</span>`;
          }
          badgeHtml = `
            <span class="badge-action ${isBuy ? 'badge-buy' : 'badge-sell'}">${ls.rec_exp}</span>
            <span style="font-size:10px;color:#cbd5e1;font-weight:700;">🕒 ${ls.time}</span>
          `;
          metaText = `CCI: ${r.cci ?? '—'} • RSI: ${r.rsi ?? '—'}`;

          const key = `${r.symbol}_${ls.direction}_${ls.bucket}`;
          if (r.is_fresh && !alertedSignals.has(key)) {
            alertedSignals.add(key);
            hasNewSignal = ls.direction;
          }
        } else if (r.status === 'WARMING') {
          badgeHtml = `<span class="badge-action badge-warm">⏳ ${r.collected}/${r.needed}</span>`;
          metaText = `Збір свічок M5...`;
        }

        return `
          <div class="pair-row">
            <div class="pair-left">
              <div class="pair-name">🔥 ${r.symbol} <span class="payout-tag">${r.payout}%</span> ${newBadge}</div>
              <div class="pair-meta">${metaText}</div>
            </div>
            <div class="pair-right">${badgeHtml}</div>
          </div>
        `;
      }).join('');

      if (hasNewSignal) {
        playBeep(hasNewSignal);
      }
    } catch (e) {
      const dot = getEl('connDot');
      if (dot) dot.className = 'status-dot';
    }
  }

  bindEvents(document);
  renderStats();
  pollServer();
  setInterval(pollServer, 1000);
</script>
</body>
</html>
