<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUPER AI PRO — M5 Trend Terminal</title>
  <style id="appStyles">
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body {
      background: #090d16;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .widget {
      width: 100%;
      max-width: 340px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: #e2e8f0;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      transition: 0.3s;
    }
    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .top-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .icon-btn:hover { background: #334155; }
    select {
      width: 100%;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      outline: none;
    }
    .exp-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 5px;
    }
    .exp-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .exp-btn {
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #94a3b8;
      padding: 6px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .exp-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
    }
    .signal-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
      margin-bottom: 10px;
      transition: 0.25s;
    }
    .signal-card.call {
      background: rgba(16, 185, 129, 0.14);
      border-color: #10b981;
    }
    .signal-card.put {
      background: rgba(239, 68, 68, 0.14);
      border-color: #ef4444;
    }
    .sig-icon { font-size: 26px; margin-bottom: 4px; }
    .sig-title { font-size: 19px; font-weight: 900; letter-spacing: 0.5px; margin-bottom: 3px; }
    .signal-card.call .sig-title { color: #34d399; }
    .signal-card.put .sig-title { color: #f87171; }
    .sig-sub { font-size: 11px; color: #94a3b8; margin-bottom: 10px; }
    .strength-head {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .bar-bg {
      width: 100%;
      height: 5px;
      background: #1e293b;
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 20%;
      background: #3b82f6;
      transition: width 0.3s;
    }
    .signal-card.call .bar-fill { background: #10b981; }
    .signal-card.put .bar-fill { background: #ef4444; }
    .readings-title {
      font-size: 10px;
      color: #64748b;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .readings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    .ind-chip {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .ind-name { color: #94a3b8; }
    .ind-val { font-weight: 800; color: #e2e8f0; }
    .ind-val.bull { color: #34d399; }
    .ind-val.bear { color: #f87171; }
    .stats-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px;
    }
    .stats-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .winrate { font-size: 18px; font-weight: 900; color: #38bdf8; }
    .counts { font-size: 11px; color: #94a3b8; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
    .btn-win {
      background: #10b981;
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 8px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-loss {
      background: #ef4444;
      color: #450a0a;
      border: none;
      border-radius: 8px;
      padding: 8px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
    }
    .sub-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .sub-btn {
      background: #1e293b;
      color: #94a3b8;
      border: none;
      border-radius: 6px;
      padding: 5px;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="widget" id="appWidget">
  <div class="header">
    <div class="brand">
      <span class="status-dot" id="connDot"></span>
      <span>SUPER AI PRO • M5</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnPip">📌 Поверх вікон</button>
      <button class="icon-btn" id="btnSound">🔊</button>
    </div>
  </div>

  <select id="pairSelect">
    <option value="EURUSD_otc">💎 EURUSD_otc</option>
    <option value="GBPUSD_otc">💎 GBPUSD_otc</option>
    <option value="USDJPY_otc">💎 USDJPY_otc</option>
    <option value="AUDUSD_otc">💎 AUDUSD_otc</option>
    <option value="USDCAD_otc">💎 USDCAD_otc</option>
    <option value="USDCHF_otc">💎 USDCHF_otc</option>
    <option value="AUDCAD_otc">💎 AUDCAD_otc</option>
    <option value="AUDNZD_otc">💎 AUDNZD_otc</option>
    <option value="XAUUSD_otc">🥇 XAUUSD_otc</option>
    <option value="BTCUSD_otc">₿ BTCUSD_otc</option>
  </select>

  <div class="exp-label">Рекомендована експірація (M5 Trend)</div>
  <div class="exp-row" id="expRow">
    <button class="exp-btn active" data-exp="5m">M5</button>
    <button class="exp-btn" data-exp="10m">M10</button>
    <button class="exp-btn" data-exp="15m">M15</button>
  </div>

  <div class="signal-card" id="signalCard">
    <div class="sig-icon" id="sigIcon">⚡</div>
    <div class="sig-title" id="sigTitle">SCANNING...</div>
    <div class="sig-sub" id="sigSub">Очікування підключення до ринку M5</div>
    <div class="strength-head">
      <span>Trend pullbacks</span>
      <span id="strengthText">waiting</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" id="strengthFill"></div></div>
  </div>

  <div class="readings-title">
    <span>Readings • M5 Candles</span>
    <span>EMA 9/21/50 + Stoch</span>
  </div>
  <div class="readings-grid">
    <div class="ind-chip"><span class="ind-name">EMA Trend</span><span class="ind-val" id="indTrend">—</span></div>
    <div class="ind-chip"><span class="ind-name">Stoch(14)</span><span class="ind-val" id="indStoch">—</span></div>
    <div class="ind-chip"><span class="ind-name">RSI(14)</span><span class="ind-val" id="indRsi">—</span></div>
    <div class="ind-chip"><span class="ind-name">Mode</span><span class="ind-val" id="indMode">M5</span></div>
  </div>

  <div class="stats-box">
    <div class="stats-top">
      <div>
        <div style="font-size:10px;color:#64748b;">Winrate (M5)</div>
        <div class="winrate" id="winRateVal">0.0%</div>
      </div>
      <div class="counts">
        <div>Плюс (+): <b id="countWin" style="color:#34d399;">0</b></div>
        <div>Мінус (−): <b id="countLoss" style="color:#f87171;">0</b></div>
        <div>Усього: <b id="countTotal">0</b></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-win" id="btnWin">+</button>
      <button class="btn-loss" id="btnLoss">−</button>
    </div>
    <div class="sub-btns">
      <button class="sub-btn" id="btnUndo">↩ Назад</button>
      <button class="sub-btn" id="btnReset">🗑 Скинути</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_API = 'https://railway.app';
  const STORAGE_KEY = 'super_ai_pro_m5_trend';
  let activeDoc = document;
  let lastSignalKey = '';

  let state = {
    apiUrl: DEFAULT_API,
    pair: 'EURUSD_otc',
    exp: '5m',
    sound: true,
    wins: 0,
    losses: 0,
    history: []
  };

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved && typeof saved === 'object') {
      state = { ...state, ...saved, apiUrl: DEFAULT_API };
    }
  } catch (e) {}

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function getEl(id) {
    return activeDoc.getElementById(id) || document.getElementById(id);
  }

  function playBeep(type) {
    if (!state.sound) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = type === 'call' ? 880 : 440;
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      osc.start();
      osc.stop(ctx.currentTime + 0.18);
    } catch (e) {}
  }

  function render() {
    const total = state.wins + state.losses;
    const rate = total > 0 ? ((state.wins / total) * 100).toFixed(1) : '0.0';
    const wEl = getEl('winRateVal');
    const cW = getEl('countWin');
    const cL = getEl('countLoss');
    const cT = getEl('countTotal');
    if (wEl) wEl.textContent = `${rate}%`;
    if (cW) cW.textContent = state.wins;
    if (cL) cL.textContent = state.losses;
    if (cT) cT.textContent = total;
  }

  function bindEvents(doc) {
    const pairSel = doc.getElementById('pairSelect');
    if (pairSel) {
      pairSel.value = state.pair;
      pairSel.onchange = (e) => {
        state.pair = e.target.value;
        saveState();
        pollServer();
      };
    }

    doc.querySelectorAll('.exp-btn').forEach(btn => {
      if (btn.dataset.exp === state.exp) btn.classList.add('active');
      else btn.classList.remove('active');
      btn.onclick = () => {
        doc.querySelectorAll('.exp-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.exp = btn.dataset.exp;
        saveState();
      };
    });

    const btnWin = doc.getElementById('btnWin');
    if (btnWin) btnWin.onclick = () => { state.wins++; state.history.push('W'); saveState(); render(); };

    const btnLoss = doc.getElementById('btnLoss');
    if (btnLoss) btnLoss.onclick = () => { state.losses++; state.history.push('L'); saveState(); render(); };

    const btnUndo = doc.getElementById('btnUndo');
    if (btnUndo) btnUndo.onclick = () => {
      const last = state.history.pop();
      if (last === 'W' && state.wins > 0) state.wins--;
      if (last === 'L' && state.losses > 0) state.losses--;
      saveState();
      render();
    };

    const btnReset = doc.getElementById('btnReset');
    if (btnReset) btnReset.onclick = () => {
      state.wins = 0; state.losses = 0; state.history = [];
      saveState();
      render();
    };

    const btnSound = doc.getElementById('btnSound');
    if (btnSound) {
      btnSound.textContent = state.sound ? '🔊' : '🔇';
      btnSound.onclick = () => {
        state.sound = !state.sound;
        btnSound.textContent = state.sound ? '🔊' : '🔇';
        saveState();
      };
    }

    const btnPip = doc.getElementById('btnPip');
    if (btnPip && 'documentPictureInPicture' in window) {
      btnPip.onclick = async () => {
        try {
          const pipWin = await window.documentPictureInPicture.requestWindow({ width: 340, height: 590 });
          const style = document.getElementById('appStyles');
          if (style) pipWin.document.head.appendChild(style.cloneNode(true));
          const widget = document.getElementById('appWidget');
          if (widget) pipWin.document.body.appendChild(widget);
          activeDoc = pipWin.document;
          bindEvents(activeDoc);
          pipWin.addEventListener('pagehide', () => {
            document.body.appendChild(widget);
            activeDoc = document;
            bindEvents(activeDoc);
          });
        } catch (e) {}
      };
    }
  }

  async function pollServer() {
    if (!state.apiUrl) return;
    try {
      const res = await fetch(`${state.apiUrl}/api/status?symbol=${encodeURIComponent(state.pair)}`);
      const data = await res.json();
      const an = data.analysis || {};

      const dot = getEl('connDot');
      if (dot) dot.className = data.connected ? 'status-dot online' : 'status-dot';

      if (Array.isArray(data.pairs) && data.pairs.length > 0) {
        const sel = getEl('pairSelect');
        if (sel) {
          const currentVal = state.pair;
          const sig = data.pairs.map(p => `${p.symbol}:${p.payout}`).join(',');
          if (sel.dataset.sig !== sig) {
            sel.dataset.sig = sig;
            sel.innerHTML = data.pairs.map(p => {
              let badge = '⚪';
              if (p.payout >= 88) badge = '🔥';
              else if (p.payout >= 78) badge = '🟡';
              return `<option value="${p.symbol}" ${p.symbol === currentVal ? 'selected' : ''}>${badge} ${p.symbol} — ${p.payout}%</option>`;
            }).join('');
          }
        }
      }

      const card = getEl('signalCard');
      const icon = getEl('sigIcon');
      const title = getEl('sigTitle');
      const sub = getEl('sigSub');
      const sText = getEl('strengthText');
      const sFill = getEl('strengthFill');

      if (card) card.className = 'signal-card';

      const indTrend = getEl('indTrend');
      if (indTrend) {
        indTrend.textContent = an.trend || '—';
        indTrend.className = 'ind-val ' + (an.trend === 'UP-TREND' ? 'bull' : (an.trend === 'DOWN-TREND' ? 'bear' : ''));
      }

      const indStoch = getEl('indStoch');
      if (indStoch) {
        indStoch.textContent = an.stoch !== undefined ? `${an.stoch}` : '—';
        indStoch.className = 'ind-val ' + (an.stoch > 60 ? 'bear' : (an.stoch !== undefined && an.stoch < 40 ? 'bull' : ''));
      }

      const rsiVal = an.rsi;
      const indRsi = getEl('indRsi');
      if (indRsi) {
        indRsi.textContent = rsiVal !== undefined ? `${rsiVal}` : '—';
        indRsi.className = 'ind-val ' + (rsiVal > 52 ? 'bull' : (rsiVal !== undefined && rsiVal < 48 ? 'bear' : ''));
      }

      if (!data.connected) {
        if (icon) icon.textContent = '🔌';
        if (title) title.textContent = 'CONNECTING...';
        if (sub) sub.textContent = 'З’єднання з сервером котирувань';
        if (sText) sText.textContent = 'offline';
        if (sFill) sFill.style.width = '0%';
      } else if (an.status === 'WARMING') {
        if (icon) icon.textContent = '⏳';
        if (title) title.textContent = `ЗБІР СВІЧОК M5 ${an.collected}/${an.needed}`;
        if (sub) sub.textContent = 'Завантаження 5-хвилинної історії...';
        if (sText) sText.textContent = 'warming';
        if (sFill) sFill.style.width = `${Math.round((an.collected / an.needed) * 40)}%`;
      } else if (an.status === 'WAIT_CANDLE') {
        if (icon) icon.textContent = '⏱';
        if (title) title.textContent = 'ПАУЗА СВІЧКИ M5';
        if (sub) sub.textContent = `Нова 5-хв свічка через ${an.wait_sec}с`;
        if (sText) sText.textContent = 'sync';
        if (sFill) sFill.style.width = '30%';
      } else if (an.status === 'SIGNAL') {
        const isCall = an.direction === 'CALL';
        const targetExp = an.rec_exp || '5m';
        state.exp = targetExp;

        activeDoc.querySelectorAll('.exp-btn').forEach(b => {
          if (b.dataset.exp === targetExp) b.classList.add('active');
          else b.classList.remove('active');
        });

        if (card) card.classList.add(isCall ? 'call' : 'put');
        if (icon) icon.textContent = isCall ? '↗' : '↘';
        if (title) title.textContent = isCall ? `BUY • ${targetExp}` : `SELL • ${targetExp}`;
        if (sub) sub.textContent = `Відкат по тренду • Ціна: ${an.price}`;

        if (sText) sText.textContent = 'HIGH (M5 TREND)';
        if (sFill) sFill.style.width = '95%';

        const sigKey = `${state.pair}_${an.direction}_${Math.floor(Date.now() / 60000)}`;
        if (lastSignalKey !== sigKey) {
          lastSignalKey = sigKey;
          playBeep(isCall ? 'call' : 'put');
        }
      } else {
        if (icon) icon.textContent = '⚡';
        if (title) title.textContent = 'ANALYZING M5...';
        if (sub) sub.textContent = `Ціна: ${an.price || '—'} • Чекаємо відкат по тренду`;
        if (sText) sText.textContent = 'scanning';
        if (sFill) sFill.style.width = '35%';
      }
    } catch (e) {
      const dot = getEl('connDot');
      if (dot) dot.className = 'status-dot';
    }
  }

  bindEvents(document);
  render();
  pollServer();
  setInterval(pollServer, 1000);
</script>
</body>
</html>
